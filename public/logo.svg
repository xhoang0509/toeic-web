<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="toeic-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284c7"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="30" y1="20" x2="36" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#toeic-grad)"/>
  <rect x="2" y="2" width="44" height="44" rx="12" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <!-- Graduation cap base -->
  <path d="M24 12L37 18.5L24 25L11 18.5L24 12Z" fill="#ffffff"/>
