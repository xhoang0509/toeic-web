  <path d="M34 20V28L32.5 30L31 28V20" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Audio wave arcs to represent Listening skill -->
  <path d="M7 24C7 14.6 14.6 7 24 7" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linecap="round"/>
  <path d="M41 24C41 33.4 33.4 41 24 41" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linecap="round"/>
</svg>
